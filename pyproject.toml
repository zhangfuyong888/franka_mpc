[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-mpc-tracking"
version = "0.1.0"
description = "IK and acceleration-level linear MPC with a simulated MIT joint interface"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.15.2", "mujoco==3.3.7", "mink==0.0.13", "osqp==1.0.4", "qpsolvers==4.8.1", "PyYAML==6.0.3", "matplotlib==3.10.7"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
panda-mpc = "panda_mpc.demo:main"
panda-analyze = "panda_mpc.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panda_mpc = ["defaults.yaml", "assets/panda/*", "assets/panda/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real MuJoCo, mink, OSQP and packaged Panda assets"]
